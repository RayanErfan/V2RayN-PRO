name: Validate PRO configs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate against latest cores
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configurations
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-release.ps1 -ValidateOnly
